<text x="892.0" y="361" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="12" fill="#1f2328" text-anchor="middle" font-weight="400">schreibt eine Zeile nach</text>
<text x="892.0" y="378" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="12" fill="#1f2328" text-anchor="middle" font-weight="400">ops.incidents, Status offen</text>
<text x="892" y="426" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="12" fill="#1f2328" text-anchor="middle" font-weight="700">Schreibrecht nur hier, in IAM.</text>
<text x="892" y="444" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="12" fill="#1f2328" text-anchor="middle" font-weight="400">Die Grenze steht zweimal: im Code, in IAM.</text>
<path d="M30 462 H1014" stroke="#d0d7de" stroke-width="1.5"/>
<text x="30" y="484" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="12.5" fill="#1f2328" text-anchor="start" font-weight="700">Die vier Teile jedes Agenten:</text>
<text x="232" y="484" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="12" fill="#1f2328" text-anchor="start" font-weight="400">Schema (Diagnose)  ·  Anweisung (INSTRUCTION)  ·  Werkzeuge (tools.py)  ·  Lauf (triage(), die Schleife, von ADK gestellt)</text>

<text x="415.0" y="356" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="12" fill="#1f2328" text-anchor="middle" font-weight="400">Kategorie, Fakten, Schlüsse,</text>
<text x="415.0" y="373" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="12" fill="#1f2328" text-anchor="middle" font-weight="400">Ursache, Vorschlag, Konfidenz</text>
<text x="415" y="414" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="12" fill="#1f2328" text-anchor="middle" font-weight="400">Das Modell hat kein Werkzeug, das schreibt, deployt, startet oder löscht.</text>
<text x="415" y="432" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="12" fill="#1f2328" text-anchor="middle" font-weight="400">Das BigQuery-Werkzeug hat die Schreibsperre, der Service-Account kein Schreibrecht auf raw.</text>

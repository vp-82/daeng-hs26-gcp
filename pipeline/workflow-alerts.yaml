# Workflow alerts-pipeline: Meldungen laden, dann Transformation.
#
# Die zweite Kette im Projekt, neben gtfs-pipeline aus Lektion 2. Eine eigene Kette, weil der Takt
# ein anderer ist: der Fahrplan kommt zweimal pro Woche, Meldungen kommen jeden Tag. Beide Ketten
# enden im selben Job transform-gtfs, denn dbt baut ohnehin alles, was sich geändert hat, und ein
# ganzer Lauf dauert eine Minute. Das Sprachmodell liest dabei nur Meldungen, die es noch nicht
# kennt (int_alerts_extracted ist inkrementell).
#
# Keine Qualitätsschranke zwischen den beiden Schritten: die Regeln für die Meldungen sind dbt-Tests
# und laufen im Transform-Job selbst. Schlägt einer fehl, endet der Job mit einem Fehler, und damit
# auch dieser Workflow. Der Alarm aus Lektion 2 meldet jede fehlgeschlagene Workflow-Execution, also
# auch diese.

main:
  steps:
    - init:
        assign:
          - project: ${sys.get_env("GOOGLE_CLOUD_PROJECT_ID")}
          - location: ${sys.get_env("GOOGLE_CLOUD_LOCATION")}
          - ingest_job: "ingest-alerts"
          - transform_job: "transform-gtfs"

    - run_ingest:
        # Holt die letzten drei Tage (Standard des Jobs). Die Überlappung ist Absicht, der Job
        # ersetzt jede Tagespartition, Duplikate entstehen keine.
        call: googleapis.run.v2.projects.locations.jobs.run
        args:
          name: ${"projects/" + project + "/locations/" + location + "/jobs/" + ingest_job}
          connector_params:
            timeout: 1800
        result: ingest_execution

    - run_transform:
        # Derselbe Job wie in gtfs-pipeline. dbt build baut die Meldungen, lässt das Modell die neuen
        # lesen, prüft die Fakten mit den Tests und rechnet die Entscheidungen neu.
        call: googleapis.run.v2.projects.locations.jobs.run
        args:
          name: ${"projects/" + project + "/locations/" + location + "/jobs/" + transform_job}
          connector_params:
            timeout: 1800
        result: transform_execution

    - done:
        return:
          ingest_execution: ${ingest_execution.response.name}
          transform_execution: ${transform_execution.response.name}
